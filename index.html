<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    @property --angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }

    :root {
      --bg:          #080505;
      --surface:     #100808;
      --surface-2:   #180a0a;
      --fire-orange: #FF4500;
      --fire-yellow: #FFB800;
      --fire-red:    #CC1100;
      --text:        #F0EAE0;
      --text-dim:    #8a7060;
      --border:      #2a1010;
      --font-d:      'Bebas Neue', Impact, sans-serif;
      --font-b:      'DM Sans', Arial, sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      background:var(--bg); color:var(--text);
      font-family:var(--font-b); min-height:100vh;
      overflow-x:hidden; -webkit-tap-highlight-color:transparent;
    }

    /* ── TOP NAV ── */
    .top-nav {
      position:sticky; top:0; z-index:100;
      background:rgba(8,5,5,0.95); backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      padding:0.7rem 1.1rem;
      display:flex; align-items:center; justify-content:space-between;
    }
    .nav-logo {
      font-family:var(--font-d); font-size:1.35rem;
      letter-spacing:0.05em; color:#fff; text-decoration:none;
    }
    .nav-logo span {
      background:linear-gradient(135deg,var(--fire-yellow),var(--fire-orange));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .nav-right { display:flex; gap:0.5rem; align-items:center; }
    .admin-btn {
      background:rgba(255,69,0,0.1);
      border:1px solid rgba(255,69,0,0.3);
      border-radius:8px; padding:0.35rem 0.7rem;
      color:var(--fire-orange); font-family:var(--font-d);
      font-size:0.75rem; letter-spacing:0.1em;
      cursor:pointer; transition:all 0.25s;
      display:none; align-items:center; gap:0.3rem;
      text-decoration:none;
    }
    .admin-btn.visible { display:flex; }
    .admin-btn:active { background:rgba(255,69,0,0.2); }

    /* ── PROFILE ── */
    .profile-wrap {
      padding:1.4rem 1.1rem 0;
      background:linear-gradient(to bottom, rgba(20,5,5,0.7), transparent);
    }
    .profile-top { display:flex; align-items:center; gap:1.1rem; margin-bottom:0.9rem; }
    .profile-avatar-ring {
      position:relative; width:74px; height:74px; flex-shrink:0;
    }
    .profile-avatar-ring::before {
      content:''; position:absolute; inset:-3px; border-radius:50%;
      background:conic-gradient(from var(--angle), transparent 0deg, var(--fire-red) 20deg, var(--fire-orange) 55deg, var(--fire-yellow) 80deg, transparent 105deg, transparent 360deg);
      animation:borderTrace 2s linear infinite; z-index:0;
    }
    @keyframes borderTrace { to { --angle:360deg; } }
    .profile-avatar-ring img {
      position:relative; z-index:1;
      width:70px; height:70px; border-radius:50%;
      object-fit:cover; border:2.5px solid var(--bg);
      display:block; margin:2px;
    }
    .profile-stats { display:flex; gap:1.3rem; flex:1; }
    .stat { text-align:center; }
    .stat-num { font-family:var(--font-d); font-size:1.2rem; color:#fff; letter-spacing:0.04em; display:block; }
    .stat-label { font-size:0.58rem; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase; }
    .profile-name { font-family:var(--font-d); font-size:0.95rem; color:#fff; letter-spacing:0.08em; margin-bottom:0.2rem; }
    .profile-bio { font-size:0.74rem; color:var(--text-dim); line-height:1.55; }
    .profile-bio .tag { color:var(--fire-orange); }
    .btn-follow {
      width:100%; margin:0.9rem 0 1rem;
      padding:0.5rem; border-radius:7px;
      font-family:var(--font-d); font-size:0.88rem; letter-spacing:0.1em;
      cursor:pointer; transition:all 0.25s ease;
      background:rgba(255,69,0,0.08); border:1px solid var(--fire-orange); color:var(--fire-yellow);
    }
    .btn-follow.following { background:transparent; border-color:var(--border); color:var(--text-dim); }

    /* ── CATEGORY TABS ── */
    .cat-tabs {
      display:flex; overflow-x:auto; scrollbar-width:none;
      background:rgba(8,5,5,0.92); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
      position:sticky; top:57px; z-index:90;
      border-top:1px solid var(--border);
    }
    .cat-tabs::-webkit-scrollbar { display:none; }
    .cat-tab {
      flex:0 0 auto; padding:0.7rem 0.9rem;
      font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase;
      color:var(--text-dim); cursor:pointer; background:none;
      border:none; border-bottom:2px solid transparent;
      transition:all 0.25s; white-space:nowrap; font-family:var(--font-b);
    }
    .cat-tab.active { color:var(--fire-orange); border-bottom-color:var(--fire-orange); }

    /* ── GRID ── */
    .posts-grid {
      display:grid; grid-template-columns:repeat(3, 1fr); gap:2px;
    }
    .post-thumb {
      position:relative; aspect-ratio:1;
      overflow:hidden; cursor:pointer; background:var(--surface);
    }
    .post-thumb:first-child { grid-column:span 2; grid-row:span 2; }
    .post-thumb img {
      width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.4s cubic-bezier(0.16,1,0.3,1), filter 0.3s ease;
    }
    .post-thumb:active img { transform:scale(1.05); filter:brightness(0.65); }
    .post-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(5,1,1,0.88) 0%, transparent 55%);
      opacity:0; pointer-events:none; transition:opacity 0.3s;
      display:flex; flex-direction:column; justify-content:flex-end; padding:0.55rem;
    }
    .post-thumb:active .post-overlay { opacity:1; }
    .overlay-stats { display:flex; gap:0.6rem; font-size:0.68rem; color:#fff; font-weight:600; }
    .cat-badge {
      position:absolute; top:5px; left:5px;
      background:rgba(255,69,0,0.88); backdrop-filter:blur(4px);
      color:#fff; font-size:0.48rem; letter-spacing:0.08em;
      text-transform:uppercase; padding:0.18rem 0.4rem;
      border-radius:3px; font-weight:700; font-family:var(--font-b);
    }
    .new-badge {
      position:absolute; top:5px; right:5px;
      background:rgba(255,184,0,0.9);
      color:#000; font-size:0.45rem; letter-spacing:0.08em;
      text-transform:uppercase; padding:0.18rem 0.4rem;
      border-radius:3px; font-weight:700; font-family:var(--font-b);
    }

    /* Empty state */
    .empty-state {
      grid-column: span 3;
      padding: 4rem 2rem;
      text-align: center;
    }
    .empty-state-icon {
      font-size: 3rem; margin-bottom: 1rem; opacity: 0.3;
    }
    .empty-state-title {
      font-family: var(--font-d);
      font-size: 1.2rem; color: var(--text-dim);
      letter-spacing: 0.1em; margin-bottom: 0.5rem;
    }
    .empty-state-sub {
      font-size: 0.75rem; color: #4a2a2a;
    }

    /* Loading */
    .loading-grid {
      display:grid; grid-template-columns:repeat(3, 1fr); gap:2px;
    }
    .loading-thumb {
      aspect-ratio:1; background:var(--surface);
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .loading-thumb:first-child { grid-column:span 2; grid-row:span 2; }
    @keyframes shimmer {
      0%,100% { background: var(--surface); }
      50% { background: var(--surface-2); }
    }

    /* ── POST MODAL ── */
    .post-modal {
      position:fixed; inset:0; z-index:9999;
      display:flex; flex-direction:column;
      background:var(--bg);
      transform:translateY(100%);
      transition:transform 0.42s cubic-bezier(0.16,1,0.3,1);
      overflow-y:auto;
    }
    .post-modal.open { transform:translateY(0); }

    .modal-header {
      position:sticky; top:0; z-index:10;
      background:rgba(8,5,5,0.96); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      padding:0.7rem 1rem;
      display:flex; align-items:center; gap:0.75rem;
    }
    .modal-back {
      background:none; border:none; color:var(--text-dim);
      width:36px; height:36px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all 0.2s; flex-shrink:0;
    }
    .modal-back:active { color:var(--fire-orange); background:rgba(255,69,0,0.1); }
    .modal-back svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
    .modal-av { width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0; border:1.5px solid var(--fire-orange); }
    .modal-av img { width:100%; height:100%; object-fit:cover; }
    .modal-info { flex:1; }
    .modal-uname { font-family:var(--font-d); font-size:0.9rem; color:#fff; letter-spacing:0.05em; }
    .modal-cat-tag { font-size:0.58rem; color:var(--fire-orange); letter-spacing:0.15em; text-transform:uppercase; }

    .modal-img-wrap { background:#030101; position:relative; }
    .modal-img-wrap img { width:100%; display:block; max-height:75vw; object-fit:cover; }

    .double-tap-heart {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
      pointer-events:none; z-index:5; font-size:5rem;
      transition:transform 0.15s ease, opacity 0.4s ease 0.2s; opacity:0;
    }
    .double-tap-heart.pop { transform:translate(-50%,-50%) scale(1.3); opacity:1; }

    .modal-actions {
      display:flex; align-items:center;
      padding:0.75rem 0.9rem 0.4rem; gap:0.1rem;
    }
    .act-btn {
      background:none; border:none; cursor:pointer;
      display:flex; align-items:center; gap:0.3rem;
      padding:0.45rem 0.55rem; border-radius:8px;
      color:var(--text-dim); font-size:0.78rem; font-family:var(--font-b);
      transition:all 0.2s;
    }
    .act-btn svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:all 0.25s; }
    .act-btn:active { transform:scale(0.88); }
    .act-btn.liked { color:#ff3b5c; }
    .act-btn.liked svg { fill:#ff3b5c; stroke:#ff3b5c; }
    .act-btn.saved svg { fill:var(--fire-yellow); stroke:var(--fire-yellow); }
    .act-spacer { flex:1; }

    .likes-line { padding:0.3rem 1rem 0.1rem; font-size:0.82rem; font-weight:600; color:#fff; }
    .modal-desc-wrap { padding:0.2rem 1rem 0.6rem; font-size:0.8rem; color:#bbb; line-height:1.6; }
    .modal-desc-wrap .uname { font-weight:600; color:#fff; margin-right:0.35rem; }
    .modal-desc-wrap .htag { color:var(--fire-orange); }
    .modal-date-line { padding:0 1rem 0.7rem; font-size:0.62rem; color:var(--text-dim); letter-spacing:0.12em; text-transform:uppercase; border-bottom:1px solid rgba(255,69,0,0.05); }

    .comments-wrap { padding:0.4rem 0 80px; }
    .comment-row { display:flex; gap:0.65rem; padding:0.55rem 1rem; align-items:flex-start; }
    .comm-av { width:28px; height:28px; border-radius:50%; flex-shrink:0; overflow:hidden; background:var(--surface-2); border:1px solid var(--border); }
    .comm-av img { width:100%; height:100%; object-fit:cover; }
    .comm-body { flex:1; }
    .comm-user { font-size:0.74rem; font-weight:600; color:#ddd; }
    .comm-text { font-size:0.76rem; color:#aaa; line-height:1.4; margin-top:0.1rem; }
    .comm-meta { display:flex; gap:0.75rem; margin-top:0.25rem; font-size:0.6rem; color:var(--text-dim); }
    .comm-like-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:0.6rem; font-family:var(--font-b); }

    .comm-input-bar {
      position:sticky; bottom:0; z-index:10;
      background:rgba(8,5,5,0.97); backdrop-filter:blur(14px);
      border-top:1px solid var(--border);
      padding:0.65rem 1rem;
      display:flex; align-items:center; gap:0.65rem;
    }
    .comm-input-av {
      width:28px; height:28px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,var(--fire-red),var(--fire-orange));
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font-d); font-size:0.6rem; color:#fff;
    }
    .comm-input {
      flex:1; background:rgba(255,255,255,0.04);
      border:1px solid var(--border); border-radius:20px;
      padding:0.45rem 0.9rem; color:var(--text);
      font-family:var(--font-b); font-size:0.8rem; outline:none;
    }
    .comm-input:focus { border-color:rgba(255,69,0,0.35); }
    .comm-input::placeholder { color:var(--text-dim); }
    .comm-send {
      background:none; border:none; color:var(--fire-orange);
      font-family:var(--font-d); font-size:0.82rem; letter-spacing:0.08em;
      cursor:pointer; transition:color 0.2s;
    }

    /* Toast */
    .toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px);
      background:rgba(255,69,0,0.15); border:1px solid rgba(255,69,0,0.4);
      backdrop-filter:blur(10px); color:var(--fire-yellow);
      font-family:var(--font-b); font-size:0.75rem; letter-spacing:0.1em;
      padding:0.55rem 1.2rem; border-radius:20px;
      opacity:0; transition:all 0.3s ease; z-index:999999;
      white-space:nowrap; pointer-events:none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @keyframes heartPop { 0%{transform:scale(1);} 30%{transform:scale(1.5);} 70%{transform:scale(0.9);} 100%{transform:scale(1);} }
    .heart-pop { animation:heartPop 0.35s cubic-bezier(0.16,1,0.3,1); }

    .footer-bar {
      text-align:center; padding:2rem 1rem 3rem;
      color:#3a1818; font-size:0.58rem;
      letter-spacing:0.3em; text-transform:uppercase;
      border-top:1px solid rgba(255,69,0,0.07);
      font-family:var(--font-b);
    }
  </style>
</head>

  <script>
  (function () {

    /* ── NETLIFY IDENTITY ── */
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (user) showAdminBtn();
      });
      window.netlifyIdentity.on('login', () => {
        showAdminBtn();
        window.netlifyIdentity.close();
      });
      window.netlifyIdentity.on('logout', () => {
        document.getElementById('admin-btn').classList.remove('visible');
      });
      window.netlifyIdentity.init();
    }

    function showAdminBtn() {
      document.getElementById('admin-btn').classList.add('visible');
    }

    /* ── CATEGORY LABELS ── */
    const catLabels = {
      wrestling: 'Wrestling',
      bulge:     'Bulge Report',
      badboys:   'Bad Boys',
      fan:       'Fan Files',
      hall:      'Hall of Flame'
    };

    /* ── STATE ── */
    let allPosts    = [];
    let filter      = 'all';
    let currentIdx  = -1;
    let likedSet    = new Set();
    let savedSet    = new Set();
    let userComms   = [];
    let isFollowing = false;
    let postLikes   = {};

    const mockComments = [
      {user:'wrestling_fan92', text:'This is FIRE absolute heat', time:'1h', likes:24},
      {user:'mat_lover_pr',    text:'The intensity in this one is everything', time:'2h', likes:18},
      {user:'grappling_life',  text:'Cannot handle this level of heat', time:'5h', likes:12},
    ];

    /* ── FETCH POSTS from _posts folder ── */
    async function fetchPosts() {
      try {
        /* Netlify sirve los archivos del repo — leemos el directorio via API */
        const res = await fetch('/_posts/');
        if (!res.ok) throw new Error('no posts yet');
        const text = await res.text();

        /* Parsear links de archivos .md */
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const links = [...doc.querySelectorAll('a[href$=".md"]')];

        if (links.length === 0) {
          showEmptyState();
          return;
        }

        /* Fetch cada archivo markdown */
        const posts = await Promise.all(links.map(async link => {
          const href = link.getAttribute('href');
          const r = await fetch(href);
          const md = await r.text();
          return parseMarkdown(md, href);
        }));

        allPosts = posts.filter(Boolean).sort((a,b) => new Date(b.date) - new Date(a.date));
        allPosts.forEach((p,i) => { if (!postLikes[i]) postLikes[i] = Math.floor(Math.random()*800)+50; });

        document.getElementById('loading-grid').style.display = 'none';
        document.getElementById('posts-grid').style.display = 'grid';
        buildGrid();

      } catch(e) {
        /* Si no hay posts todavía, mostrar estado vacío */
        showEmptyState();
      }
    }

    /* ── PARSE MARKDOWN FRONTMATTER ── */
    function parseMarkdown(md, href) {
      try {
        const fmMatch = md.match(/^---\n([\s\S]*?)\n---/);
        if (!fmMatch) return null;
        const fm = fmMatch[1];
        const get = key => {
          const m = fm.match(new RegExp(`^${key}:\\s*(.+)$`, 'm'));
          return m ? m[1].trim().replace(/^["']|["']$/g, '') : '';
        };
        return {
          title:       get('title'),
          image:       get('image'),
          category:    get('category'),
          description: get('description'),
          date:        get('date'),
          slug:        href
        };
      } catch(e) { return null; }
    }

    function showEmptyState() {
      document.getElementById('loading-grid').style.display = 'none';
      document.getElementById('posts-grid').style.display = 'grid';
      const grid = document.getElementById('posts-grid');
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">&#128247;</div>
          <div class="empty-state-title">No posts yet</div>
          <div class="empty-state-sub">Tap NEW POST to publish your first photo</div>
        </div>
      `;
      document.getElementById('total-posts').textContent = '0';
    }

    /* ── BUILD GRID ── */
    function buildGrid() {
      const grid = document.getElementById('posts-grid');
      grid.innerHTML = '';

      const filtered = filter === 'all'
        ? allPosts
        : allPosts.filter(p => p.category === filter);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">&#128247;</div>
            <div class="empty-state-title">No posts in this category</div>
            <div class="empty-state-sub">Publish something in ${catLabels[filter] || filter}</div>
          </div>
        `;
        return;
      }

      document.getElementById('total-posts').textContent = allPosts.length;

      filtered.forEach((p, i) => {
        const realIdx = allPosts.indexOf(p);
        const div = document.createElement('div');
        div.className = 'post-thumb';
        if (i === 0) { div.style.gridColumn = 'span 2'; div.style.gridRow = 'span 2'; }

        const isNew = i < 2;
        div.innerHTML = `
          <img src="" data-src="${p.image}" alt="" loading="${i < 6 ? 'eager' : 'lazy'}" decoding="async">
          <div class="cat-badge">${catLabels[p.category] || p.category}</div>
          ${isNew ? '<div class="new-badge">NEW</div>' : ''}
          <div class="post-overlay">
            <div class="overlay-stats">
              <span>&#9829; ${fmt(postLikes[realIdx] || 0)}</span>
              <span>&#9997; ${mockComments.length}</span>
            </div>
          </div>
        `;

        /* Lazy load */
        const img = div.querySelector('img');
        new IntersectionObserver(([en], obs) => {
          if (en.isIntersecting) { img.src = img.dataset.src; img.removeAttribute('data-src'); obs.disconnect(); }
        }, { rootMargin:'80px' }).observe(img);

        div.addEventListener('click', () => openPost(realIdx));
        grid.appendChild(div);
      });
    }

    const fmt = n => n >= 1000 ? (n/1000).toFixed(1)+'K' : n;

    /* ── OPEN POST ── */
    function openPost(idx) {
      currentIdx = idx;
      const p = allPosts[idx];
      document.getElementById('modal-img').src = p.image;
      document.getElementById('modal-cat-tag').textContent = catLabels[p.category] || p.category;

      /* Desc con hashtags */
      const html = (p.description || '').split(/(#\w+)/g)
        .map(pt => pt.startsWith('#') ? `<span class="htag">${pt}</span>` : pt).join('');
      document.getElementById('modal-desc').innerHTML = html;

      /* Date */
      const d = new Date(p.date);
      const dateStr = isNaN(d) ? p.date : d.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
      document.getElementById('modal-date-line').textContent = dateStr.toUpperCase();

      if (!postLikes[idx]) postLikes[idx] = Math.floor(Math.random()*800)+50;
      updateLikeUI(idx);
      document.getElementById('save-btn').classList.toggle('saved', savedSet.has(idx));
      renderComments(idx);

      document.getElementById('post-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePost() {
      document.getElementById('post-modal').classList.remove('open');
      document.body.style.overflow = '';
      currentIdx = -1;
    }

    function updateLikeUI(idx) {
      const liked = likedSet.has(idx);
      document.getElementById('like-btn').classList.toggle('liked', liked);
      document.getElementById('like-count').textContent = fmt(postLikes[idx] || 0);
      document.getElementById('likes-line').textContent = `${fmt(postLikes[idx] || 0)} likes`;
    }

    function renderComments(idx) {
      const all = [...mockComments, ...userComms.filter(c => c.postIdx === idx)];
      document.getElementById('comm-count').textContent = all.length;
      document.getElementById('comments-list').innerHTML = all.map(c => `
        <div class="comment-row">
          <div class="comm-av"><img src="https://i.postimg.cc/KvXW1VW5/Tumblr-l-1792805306594327.jpg" alt="" loading="lazy"></div>
          <div class="comm-body">
            <span class="comm-user">${c.user}</span>
            <div class="comm-text">${c.text}</div>
            <div class="comm-meta">
              <span>${c.time}</span>
              <button class="comm-like-btn">${c.likes} likes</button>
              <button class="comm-like-btn">Reply</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    /* ── EVENTS ── */
    document.getElementById('modal-back').addEventListener('click', closePost);

    let tStartY = 0;
    const modal = document.getElementById('post-modal');
    modal.addEventListener('touchstart', e => { tStartY = e.touches[0].clientY; }, {passive:true});
    modal.addEventListener('touchend', e => {
      if (e.changedTouches[0].clientY - tStartY > 90 && modal.scrollTop === 0) closePost();
    });

    document.getElementById('like-btn').addEventListener('click', () => {
      if (currentIdx < 0) return;
      if (likedSet.has(currentIdx)) { likedSet.delete(currentIdx); postLikes[currentIdx]--; }
      else {
        likedSet.add(currentIdx); postLikes[currentIdx]++;
        const svg = document.querySelector('#like-btn svg');
        svg.classList.add('heart-pop');
        setTimeout(() => svg.classList.remove('heart-pop'), 350);
      }
      updateLikeUI(currentIdx);
    });

    let lastTap = 0;
    document.getElementById('modal-img-wrap').addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTap < 350) {
        if (currentIdx >= 0 && !likedSet.has(currentIdx)) {
          likedSet.add(currentIdx); postLikes[currentIdx]++;
          updateLikeUI(currentIdx);
        }
        const heart = document.getElementById('dbl-heart');
        heart.classList.add('pop');
        setTimeout(() => heart.classList.remove('pop'), 700);
        e.preventDefault();
      }
      lastTap = now;
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      if (currentIdx < 0) return;
      savedSet.has(currentIdx) ? savedSet.delete(currentIdx) : savedSet.add(currentIdx);
      document.getElementById('save-btn').classList.toggle('saved', savedSet.has(currentIdx));
      toast(savedSet.has(currentIdx) ? 'Saved!' : 'Removed from saved');
    });

    document.getElementById('comm-focus-btn').addEventListener('click', () => document.getElementById('comm-input').focus());

    function sendComment() {
      const txt = document.getElementById('comm-input').value.trim();
      if (!txt || currentIdx < 0) return;
      userComms.push({ postIdx:currentIdx, user:'you', text:txt, time:'Just now', likes:0 });
      document.getElementById('comm-input').value = '';
      renderComments(currentIdx);
      toast('Comment posted!');
    }
    document.getElementById('comm-send').addEventListener('click', sendComment);
    document.getElementById('comm-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendComment(); });

    document.querySelectorAll('.cat-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filter = btn.dataset.cat;
        buildGrid();
      });
    });

    document.getElementById('btn-follow').addEventListener('click', function() {
      isFollowing = !isFollowing;
      this.textContent = isFollowing ? 'FOLLOWING' : 'FOLLOW';
      this.classList.toggle('following', isFollowing);
      toast(isFollowing ? 'Following!' : 'Unfollowed');
    });

    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    /* ── INIT ── */
    fetchPosts();

  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — HOTT WRESTLING</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --fire-orange: #FF4500;
      --text: #f0f0f0;
      --text-dim: #888;
      --font-d: 'Bebas Neue', sans-serif;
      --font-b: 'DM Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-b);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
    }
    /* Animated background glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,69,0,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      50%       { opacity: 1;   transform: translateX(-50%) scale(1.15); }
    }
    .logo {
      font-family: var(--font-d);
      font-size: clamp(1rem, 4vw, 1.2rem);
      letter-spacing: 0.2em;
      color: var(--text-dim);
      margin-bottom: 2rem;
    }
    .code {
      font-family: var(--font-d);
      font-size: clamp(6rem, 25vw, 10rem);
      line-height: 1;
      color: var(--fire-orange);
      text-shadow: 0 0 60px rgba(255,69,0,0.4);
      letter-spacing: -0.02em;
      animation: flicker 6s ease-in-out infinite;
    }
    @keyframes flicker {
      0%, 90%, 100% { opacity: 1; }
      92%           { opacity: 0.85; }
      94%           { opacity: 1; }
      96%           { opacity: 0.9; }
    }
    .title {
      font-family: var(--font-d);
      font-size: clamp(1.4rem, 6vw, 2rem);
      letter-spacing: 0.12em;
      margin: 0.75rem 0 0.5rem;
    }
    .sub {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--fire-orange);
      color: #fff;
      text-decoration: none;
      font-family: var(--font-d);
      font-size: 1rem;
      letter-spacing: 0.1em;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(255,69,0,0.35);
    }
    .btn:active { transform: scale(0.96); }
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap');
  </style>
</head>
<body>
  <div class="logo">HOTT WRESTLING</div>
  <div class="code">404</div>
  <div class="title">PAGE NOT FOUND</div>
  <p class="sub">Looks like this move doesn't exist. Get back to the mat.</p>
  <a href="/" class="btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    BACK TO HOME
  </a>
</body>
</html>

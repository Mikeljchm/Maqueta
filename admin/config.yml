backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

locale: en

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: Title
        name: title
        widget: string

      - label: Photos
        name: images
        widget: list
        field:
          label: Photo URL
          name: url
          widget: string
          hint: "Paste Imgbox link here"

      - label: Category
        name: category
        widget: select
        options:
          - { label: "Wrestling", value: "wrestling" }
          - { label: "Bulge Report", value: "bulge" }
          - { label: "Bad Boys", value: "badboys" }
          - { label: "Fan Files", value: "fan" }
          - { label: "Hall of Flame", value: "hall" }
          - { label: "AI Gallery", value: "ai" }
          - { label: "Audio", value: "audio" }

      - label: Description
        name: description
        widget: text
        hint: "Write something hot... use #hashtags"

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

  - name: wrestlers
    label: The Ring — Wrestlers
    folder: _wrestlers
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Tag", name: "tag", widget: "string", hint: "Ex: Heavyweight Champion" }
      - { label: "Photo URL", name: "photo", widget: "string", hint: "Paste Imgbox link" }
      - { label: "Bio", name: "bio", widget: "text" }

  - name: badboys
    label: Bad Boys
    folder: _badboys
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Mugshot URL", name: "mugshot", widget: "string", hint: "Paste Imgbox link" }
      - { label: "Description", name: "description", widget: "text" }
      - label: Tags
        name: tags
        widget: list
        field: { label: "Tag", name: "tag", widget: "string" }

  - name: stories
    label: Locker Room — Stories
    label_singular: Story
    folder: _stories
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: Title
        name: title
        widget: string
      - label: Category
        name: category
        widget: string
        hint: "stepfather, wrestling, college, locker-room..."
      - label: Cover Image URL
        name: cover
        widget: string
        required: false
      - label: Extra Photos (unlimited)
        name: images
        widget: list
        allow_add: true
        required: false
        field:
          label: Photo URL
          name: url
          widget: string
      - label: Read Time
        name: read_time
        widget: string
        default: "5 min read"
        required: false
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: Languages
        name: languages
        widget: list
        allow_add: true
        fields:

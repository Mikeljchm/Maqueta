backend:
  name: github
  repo: Mikeljchm/Maqueta
  branch: main

media_folder: uploads
public_folder: /uploads

locale: en

collections:

  - name: posts
    label: Posts — Feed
    label_singular: Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: Title
        name: title
        widget: string
      - label: Category
        name: category
        widget: string
        hint: "wrestling, bulge, studs, fan, hall, ai..."
      - label: Adult Content (+18)
        name: adult
        widget: boolean
        default: false
        required: false
      - label: Video Poster (cover image URL)
        name: poster
        widget: string
        required: false
        hint: "URL de la imagen de portada para todos los videos del post"
      - label: Photos (unlimited)
        name: images
        widget: list
        allow_add: true
        field:
          label: Photo URL
          name: url
          widget: string
          hint: "https://hottwrestling.b-cdn.net/..."
      - label: Adult Photos +18 (unlimited)
        name: adult_images
        widget: list
        allow_add: true
        required: false
        field:
          label: Photo URL
          name: url
          widget: string
          hint: "Fotos xxx — siempre con blur para no logueados"
      - label: GIFs (unlimited)
        name: gifs
        widget: list
        allow_add: true
        required: false
        field:
          label: GIF URL
          name: url
          widget: string
      - label: Videos (unlimited)
        name: videos
        widget: list
        allow_add: true
        required: false
        field:
          label: Video URL
          name: url
          widget: string
      - label: Description
        name: description
        widget: text
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false


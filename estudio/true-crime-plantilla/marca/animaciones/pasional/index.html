<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:PF;src:url(assets/playfair-display-latin-700-italic.woff2);font-style:italic;font-weight:700}
@font-face{font-family:IT;src:url(assets/inter-tight-latin-300-normal.woff2);font-weight:300}
@font-face{font-family:IT;src:url(assets/inter-tight-latin-500-normal.woff2);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070204}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#070204}
.full{position:absolute;inset:0}
#bg{background:radial-gradient(ellipse 70% 75% at 50% 50%,#3d0c17 0%,#1a060b 55%,#070204 100%);opacity:0}
#pulse{background:radial-gradient(circle at 50% 62%,rgba(225,30,60,.55),rgba(225,30,60,0) 45%);opacity:0;mix-blend-mode:screen}
#cam{position:absolute;inset:0}
#bajo{position:absolute;left:0;right:0;top:228px;text-align:center;font:italic 700 300px/1.2 PF;color:#e0233f;
  text-shadow:0 0 70px rgba(224,35,63,.45);
  -webkit-mask-image:linear-gradient(100deg,#000 0%,#000 var(--p),transparent calc(var(--p) + 7%));
  mask-image:linear-gradient(100deg,#000 0%,#000 var(--p),transparent calc(var(--p) + 7%));--p:-8%}
#sheen{position:absolute;left:0;right:0;top:228px;text-align:center;font:italic 700 300px/1.2 PF;color:transparent;
  background:linear-gradient(100deg,transparent 0%,transparent 46%,rgba(255,226,220,.6) 50%,transparent 54%,transparent 100%);
  background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;opacity:0}
#pen{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;
  box-shadow:0 0 30px 12px rgba(255,80,100,.9),0 0 90px 40px rgba(224,35,63,.5);opacity:0;left:0;top:0}
#rise{position:absolute;left:0;right:0;top:520px;height:180px;overflow:hidden}
#sos{position:absolute;left:0;right:0;top:4px;text-align:center;font:300 144px/1.2 IT;color:#f3e7dd;white-space:nowrap}
#sos span{display:inline-block;margin:0 .16em;opacity:0}
#ecg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#head{opacity:0}
#tag{position:absolute;left:0;right:0;top:812px;text-align:center;font:500 26px/1.4 IT;color:#e7b3b3;white-space:nowrap}
#tag span{display:inline-block;margin:0 .32em;opacity:0}
#tag .sp{width:.5em}
#flash{background:radial-gradient(circle at 50% 45%,rgba(255,120,130,.55),rgba(224,35,63,.35) 35%,rgba(0,0,0,0) 75%);opacity:0;mix-blend-mode:screen}
#embers,#grain{position:absolute;left:0;top:0}
#grain{width:1920px;height:1080px;opacity:.10;mix-blend-mode:overlay}
#vig{background:radial-gradient(ellipse 80% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
#drain{background:#0a0809;opacity:0;mix-blend-mode:saturation}
#black{background:#000;opacity:1}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
  <div id="scene" class="clip full" data-start="0" data-duration="10" data-track-index="0">
    <div id="bg" class="full"></div>
    <div id="pulse" class="full"></div>
    <div id="cam">
      <div id="bajo">Bajo</div>
      <div id="sheen">Bajo</div>
      <div id="pen"></div>
      <div id="rise"><div id="sos"></div></div>
      <svg id="ecg" viewBox="0 0 1920 1080">
        <defs>
          <clipPath id="c1"><rect id="r1" x="0" y="0" width="0" height="1080"/></clipPath>
          <clipPath id="c2"><rect id="r2" x="0" y="0" width="0" height="1080"/></clipPath>
          <filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g id="l1" clip-path="url(#c1)" filter="url(#gl)"><path id="p1" fill="none" stroke="#ff2e4a" stroke-width="3.5" stroke-linejoin="round"/></g>
        <g id="l2" clip-path="url(#c2)" filter="url(#gl)"><path id="p2" fill="none" stroke="#ff2e4a" stroke-width="3.5" stroke-linejoin="round"/></g>
        <circle id="head" r="7" fill="#fff" filter="url(#gl)"/>
      </svg>
      <div id="tag"></div>
    </div>
    <canvas id="embers" width="1920" height="1080"></canvas>
    <div id="flash" class="full"></div>
    <div id="drain" class="full"></div>
    <div id="vig" class="full"></div>
    <canvas id="grain" width="960" height="540"></canvas>
    <div id="black" class="full"></div>
  </div>
  <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="10" data-track-index="1" data-volume="1"></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const $=s=>document.querySelector(s);
const Y0=700;
// semilla determinista
function rng(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
// forma de un latido (PQRST) alrededor de x0
function beat(x,x0,amp){const d=x-x0;let y=0;
  y+=-10*amp*Math.exp(-Math.pow((d+70)/14,2));       // P
  y+= 18*amp*Math.exp(-Math.pow((d+18)/5,2));        // Q
  y+=-150*amp*Math.exp(-Math.pow((d)/6,2));          // R
  y+= 55*amp*Math.exp(-Math.pow((d-14)/6,2));        // S
  y+=-22*amp*Math.exp(-Math.pow((d-75)/20,2));       // T
  return y}
const B1=[432,1200,1824], B2=[600];
const y1=x=>Y0+B1.reduce((a,b)=>a+beat(x,b,1),0);
const y2=x=>Y0+B2.reduce((a,b)=>a+beat(x,b,1.1),0);
function pathOf(f){let d='';for(let x=-10;x<=1930;x+=2)d+=(x<-9?'M':'L')+x+' '+f(x).toFixed(1);return d}
$('#p1').setAttribute('d',pathOf(y1)); $('#p2').setAttribute('d',pathOf(y2));
// letras
'SOSPECHA'.split('').forEach(c=>{const s=document.createElement('span');s.textContent=c;$('#sos').appendChild(s)});
'TODOS LO ESTÁN'.split('').forEach(c=>{const s=document.createElement('span');if(c===' '){s.className='sp';s.innerHTML='&nbsp;'}else s.textContent=c;$('#tag').appendChild(s)});

// ---- trazos del electro (cabeza a 960 px/s y 1600 px/s)
const tr1={x:0}, tr2={x:0};
const head=$('#head');
function draw1(){ $('#r1').setAttribute('width',tr1.x); head.setAttribute('cx',tr1.x); head.setAttribute('cy',y1(tr1.x)); }
function draw2(){ $('#r2').setAttribute('width',tr2.x); head.setAttribute('cx',tr2.x); head.setAttribute('cy',y2(tr2.x)); }

tl.fromTo('#black',{opacity:1},{opacity:0,duration:0.6,ease:'power1.out',immediateRender:false},0.15);
tl.fromTo('#bg',{opacity:0},{opacity:0.55,duration:1.2,ease:'sine.inOut'},0.3);
tl.fromTo(head,{opacity:0},{opacity:1,duration:0.05,immediateRender:false},0.5);
tl.fromTo(tr1,{x:0},{x:1920,duration:2.0,ease:'none',onUpdate:draw1,immediateRender:false},0.5);
tl.fromTo(head,{opacity:1},{opacity:0,duration:0.1,immediateRender:false},2.5);
// pulso de luz en cada latido
[0.95,1.75,2.4].forEach((t,i)=>{
  tl.fromTo('#pulse',{opacity:0},{opacity:0.5+i*0.2,duration:0.06,ease:'power2.out',immediateRender:false},t);
  tl.fromTo('#pulse',{opacity:0.5+i*0.2},{opacity:0,duration:0.7,ease:'power2.in',immediateRender:false},t+0.06);
});
tl.to('#bg',{opacity:1,duration:1.4,ease:'power2.out'},2.4);
// SOSPECHA nace de la línea
tl.fromTo('#sos span',{yPercent:110,opacity:0},{yPercent:0,opacity:1,duration:0.9,ease:'power4.out',stagger:0.06,immediateRender:false},2.4);
tl.fromTo('#sos',{scaleX:1.12},{scaleX:1,duration:2.2,ease:'power3.out',immediateRender:false},2.4);
tl.to('#l1',{opacity:0,duration:1.0,ease:'power2.inOut'},2.7);
// "Bajo" se escribe con una punta de luz
const pen=$('#pen'); const pr={p:-8};
function drawPen(){ $('#bajo').style.setProperty('--p',pr.p+'%');
  const x=530+ (pr.p+4)/104*860; const y=408 - Math.sin((pr.p+8)/108*Math.PI*3)*45;
  pen.style.left=x+'px'; pen.style.top=y+'px'; }
tl.fromTo(pen,{opacity:0},{opacity:1,duration:0.15,immediateRender:false},3.2);
tl.fromTo(pr,{p:-8},{p:100,duration:1.2,ease:'power2.inOut',onUpdate:drawPen,immediateRender:false},3.2);
tl.fromTo(pen,{opacity:1,scale:1},{opacity:0,scale:2.5,duration:0.3,ease:'power2.out',immediateRender:false},4.4);
tl.fromTo('#bajo',{y:14},{y:0,duration:1.4,ease:'power2.out',immediateRender:false},3.2);
// impacto 4.4
tl.fromTo('#flash',{opacity:0},{opacity:0.7,duration:0.04,immediateRender:false},4.4);
tl.fromTo('#flash',{opacity:0.7},{opacity:0,duration:0.9,ease:'power2.out',immediateRender:false},4.44);
const sh=[[10,-6],[-8,5],[6,4],[-4,-3],[2,2],[0,0]];
sh.forEach((d,i)=>tl.to('#cam',{x:d[0],y:d[1],duration:0.045,ease:'none'},4.4+i*0.045));
tl.fromTo('#sos span',{opacity:1},{opacity:0.35,duration:0.03,stagger:{each:0.02,from:'center'},immediateRender:false,yoyo:true,repeat:1},4.42);
tl.fromTo('#cam',{scale:1},{scale:1.06,duration:4.2,ease:'sine.inOut',immediateRender:false},4.4);
// brillo que recorre "Bajo"
tl.fromTo('#sheen',{opacity:0},{opacity:1,duration:0.1,immediateRender:false},5.0);
tl.fromTo('#sheen',{backgroundPosition:'100% 0'},{backgroundPosition:'0% 0',duration:1.3,ease:'power2.inOut',immediateRender:false},5.0);
tl.to('#sheen',{opacity:0,duration:0.2},6.3);
// eslogan
tl.fromTo('#tag span',{opacity:0,y:10,filter:'blur(6px)'},{opacity:1,y:0,filter:'blur(0px)',duration:0.5,ease:'power2.out',stagger:0.035,immediateRender:false},5.4);
// remate: último latido y línea plana
tl.to('#l1',{opacity:0,duration:0.4},7.4);
tl.fromTo(head,{opacity:0},{opacity:1,duration:0.05,immediateRender:false},8.0);
tl.fromTo(tr2,{x:0},{x:1920,duration:1.2,ease:'none',onUpdate:draw2,immediateRender:false},8.0);
tl.fromTo('#pulse',{opacity:0},{opacity:0.8,duration:0.06,immediateRender:false},8.375);
tl.fromTo('#pulse',{opacity:0.8},{opacity:0,duration:0.6,immediateRender:false},8.44);
tl.fromTo('#drain',{opacity:0},{opacity:1,duration:0.8,ease:'power2.in',immediateRender:false},8.75);
tl.to('#bajo',{textShadow:'0 0 0px rgba(224,35,63,0)',color:'#5e4f52',duration:0.8},8.75);tl.to('#sos',{color:'#8a8083',duration:0.8},8.75);
tl.to('#bg',{opacity:0.35,duration:0.8},8.75);
tl.fromTo('#black',{opacity:0},{opacity:1,duration:0.03,immediateRender:false},9.6);

// brasas
const ec=$('#embers').getContext('2d'); const R=rng(11); const E=[];
for(let i=0;i<70;i++)E.push({x:R()*1920,s:R()*6,v:40+R()*90,r:0.8+R()*2.2,ph:R()*6.28,a:0.3+R()*0.6});
function drawEmbers(t){ec.clearRect(0,0,1920,1080); if(t<4.3||t>9.6)return; const k=Math.min(1,(t-4.3)/0.8)*(t>8.8?Math.max(0,1-(t-8.8)/0.6):1);
  for(const e of E){const tt=t-4.3+e.s; const y=1100-((tt*e.v)%1250); const x=e.x+Math.sin(tt*1.3+e.ph)*30;
    ec.globalAlpha=e.a*k*(0.6+0.4*Math.sin(tt*5+e.ph)); ec.fillStyle='#ff5a5a'; ec.beginPath(); ec.arc(x,y,e.r,0,6.283); ec.fill();}}
// grano
const gc=$('#grain').getContext('2d'); const gi=gc.createImageData(960,540);
function drawGrain(t){const f=Math.floor(t*24); let s=(f*9301+49297)%233280+1; const d=gi.data;
  for(let i=0;i<d.length;i+=4){s=(s*16807)%2147483647; const v=s&255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;} gc.putImageData(gi,0,0);}
const clock={t:0};
tl.fromTo(clock,{t:0},{t:10,duration:10,ease:'none',immediateRender:false,onUpdate:()=>{const t=tl.time();drawEmbers(t);drawGrain(t);}},0);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>

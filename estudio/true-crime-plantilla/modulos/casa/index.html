<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:DM;src:url(assets/dm-serif-display-latin-400-normal.woff2)}
@font-face{font-family:IT;src:url(assets/inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IT;src:url(assets/inter-tight-latin-300-normal.woff2);font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0507}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0b0507}
.full{position:absolute;inset:0}
#grid{background-color:#110609;background-image:linear-gradient(rgba(239,228,218,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(239,228,218,.06) 1px,transparent 1px),linear-gradient(rgba(239,228,218,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(239,228,218,.025) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;opacity:0}
#photo{position:absolute;left:310px;top:150px;width:1300px;height:840px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#photo img{width:1300px;height:840px;object-fit:cover}
#plab{position:absolute;left:310px;top:80px;font:500 38px IT;letter-spacing:.32em;color:#efe4da;opacity:0}
#pcred{position:absolute;right:310px;top:1000px;font:300 22px IT;color:#9d8c86;opacity:0}
#cam{position:absolute;inset:0}
#plan{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.ln{fill:none;stroke:#efe4da;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#efe4da;stroke-width:2;stroke-opacity:.6}
.lab{font:500 34px IT;letter-spacing:.24em;fill:#d9c9bd}
.labR{font:500 30px IT;letter-spacing:.2em;fill:#ffd6dc}
.small{font:500 22px IT;letter-spacing:.18em;fill:#d9c9bd}
#ent{fill:url(#hatch);stroke:#ff2e4a;stroke-width:4;opacity:0}
#stamp{position:absolute;left:70px;bottom:50px;font:500 28px IT;letter-spacing:.3em;color:#e3324b;border:3px solid #e3324b;padding:10px 18px;opacity:0}
#tit{position:absolute;left:70px;top:56px;opacity:0}
#tit .t{font:400 78px/1 DM;color:#efe4da}
#tit .s{font:500 28px IT;letter-spacing:.3em;color:#b9a79f;margin-top:10px}
#flash{background:#fff;opacity:0}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:.08;mix-blend-mode:overlay}
#vig{background:radial-gradient(ellipse 85% 85% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
#black{background:#000;opacity:1}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
 <div id="scene" class="clip full" data-start="0" data-duration="15" data-track-index="0">
  <div id="grid" class="full"></div>
  <div id="photo"><img id="pimg" src="assets/casa.jpg"></div><div id="plab">PARCELA 16 · PARQUE STOCKER</div><div id="pcred">Foto: La Tercera</div>
  <div id="cam"><svg id="plan" viewBox="0 0 1920 1080">
   <defs><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="rgba(200,20,40,.28)"/><line x1="0" y1="0" x2="0" y2="18" stroke="#ff2e4a" stroke-width="3" stroke-opacity=".7"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   <polygon id="ent" points="1280,650 1590,650 1280,424" filter="url(#glow)"/>
   <g id="draw">
    <path class="ln" pathLength="1" d="M200 880 L1720 880"/>
    <path class="ln" pathLength="1" d="M380 880 L380 650 M1540 880 L1540 650"/>
    <path class="ln" pathLength="1" d="M330 650 L1590 650"/>
    <path class="ln" pathLength="1" d="M300 672 L960 190 L1620 672"/>
    <path class="ln" pathLength="1" d="M640 650 L640 470 L831 330 L1089 330 L1280 470 L1280 650"/>
    <path class="thin" pathLength="1" d="M560 880 L560 760 L700 760 L700 880 M1340 880 L1340 822 L1482 822 L1482 880"/>
    <path class="thin" pathLength="1" d="M840 650 L840 615 L1090 615 L1090 650 M840 615 L840 590 L880 590 L880 615"/>
    <path class="ln" pathLength="1" d="M1371 820 L1371 430 M1389 820 L1389 430 M1430 820 L1430 470 M1452 820 L1452 470"/>
   </g>
   <rect id="door" x="1273" y="590" width="14" height="58" fill="#0b0507" stroke="#ff2e4a" stroke-width="4" opacity="0"/>
   <circle id="latch" cx="1262" cy="620" r="7" fill="#ff2e4a" opacity="0"/>
   <g id="labs" opacity="0">
    <text class="lab" x="900" y="810" text-anchor="middle">PLANTA BAJA</text>
    <text class="lab" x="960" y="545" text-anchor="middle">DORMITORIO PRINCIPAL</text>
    <text class="lab" x="960" y="305" text-anchor="middle" style="font-size:28px">MANSARDA</text>
   </g>
   <g id="labE" opacity="0"><path d="M1400 590 L1470 512 L1500 512" fill="none" stroke="#ffd6dc" stroke-width="2.5"/><text class="labR" x="1508" y="522" text-anchor="start">ENTRETECHO</text></g>
   <g id="labP" opacity="0"><text class="small" x="1420" y="418" text-anchor="middle">TUBOS DE LA ESTUFA</text></g>
   <g id="labD" opacity="0"><text class="small" x="1250" y="575" text-anchor="end">PUERTECITA</text><text class="small" x="1250" y="603" text-anchor="end" style="fill:#ff6b7a">CERRADA DESDE AFUERA</text></g>
   <g id="m2" opacity="0"><path d="M1296 630 L1360 630" stroke="#ffd6dc" stroke-width="3" stroke-dasharray="8 7"/><path d="M1352 622 L1362 630 L1352 638" fill="none" stroke="#ffd6dc" stroke-width="3"/><text class="small" x="1328" y="664" text-anchor="middle" style="fill:#ffd6dc">≈ 2 m</text></g>
  </svg></div>
  <div id="tit"><div class="t">La casa</div><div class="s">CORTE TRANSVERSAL · PARCELA 16</div></div>
  <div id="stamp">RECREACIÓN · NO A ESCALA</div>
  <div id="vig" class="full"></div><canvas id="grain" width="960" height="540"></canvas><div id="flash" class="full"></div><div id="black" class="full"></div>
 </div>
 <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="15" data-track-index="1" data-volume="1"></audio>
</div>
<script>
window.__timelines=window.__timelines||{}; const tl=gsap.timeline({paused:true}); const $=s=>document.querySelector(s);
const paths=[...document.querySelectorAll('#draw path')]; gsap.set(paths,{attr:{'stroke-dasharray':1,'stroke-dashoffset':1}});
gsap.set('#cam',{transformOrigin:'0 0'});
// 1. la foto real
tl.fromTo('#black',{opacity:1},{opacity:0,duration:0.02,immediateRender:false},0.1);
tl.fromTo('#flash',{opacity:0},{opacity:0.9,duration:0.02,immediateRender:false},0.1);
tl.fromTo('#flash',{opacity:0.9},{opacity:0,duration:0.5,immediateRender:false},0.12);
tl.fromTo('#pimg',{scale:1.0},{scale:1.08,duration:3.8,ease:'none',immediateRender:false},0.1);
tl.fromTo('#plab',{opacity:0,x:-20},{opacity:1,x:0,duration:0.6,immediateRender:false},0.5);
tl.fromTo('#pcred',{opacity:0},{opacity:1,duration:0.5,immediateRender:false},0.8);
// 2. pasa a plano
tl.to(['#photo','#plab','#pcred'],{opacity:0,duration:0.7,ease:'power2.in'},3.4);
tl.fromTo('#grid',{opacity:0},{opacity:1,duration:0.8,immediateRender:false},3.6);
paths.forEach((p,i)=>tl.fromTo(p,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:0.7,ease:'power2.inOut',immediateRender:false},4.0+i*0.35));
tl.fromTo('#tit',{opacity:0,y:-14},{opacity:1,y:0,duration:0.6,immediateRender:false},4.2);
tl.fromTo('#labs',{opacity:0},{opacity:1,duration:0.6,immediateRender:false},6.2);
tl.fromTo('#stamp',{opacity:0,scale:1.4},{opacity:1,scale:1,duration:0.2,ease:'power4.in',immediateRender:false},6.6);
// 3. zoom al entretecho
const zoom=(fx,fy,s)=>({x:960-fx*s,y:540-fy*s,scale:s});
tl.fromTo('#cam',zoom(960,540,1),{...zoom(1360,575,2.1),duration:1.6,ease:'power3.inOut',immediateRender:false},7.4);tl.to('#labs',{opacity:0.25,duration:0.6},7.6);tl.to('#labs',{opacity:1,duration:0.6},13.2);
tl.to('#tit',{opacity:0,duration:0.4},7.4);
tl.fromTo('#ent',{opacity:0},{opacity:1,duration:0.5,immediateRender:false},8.6);
tl.fromTo('#labE',{opacity:0},{opacity:1,duration:0.4,immediateRender:false},8.8);
tl.fromTo('#labP',{opacity:0},{opacity:1,duration:0.4,immediateRender:false},9.4);
tl.fromTo('#door',{opacity:0},{opacity:1,duration:0.2,immediateRender:false},10.2);
tl.fromTo('#labD',{opacity:0},{opacity:1,duration:0.4,immediateRender:false},10.3);
tl.fromTo('#latch',{opacity:0,scale:2.5,transformOrigin:'50% 50%'},{opacity:1,scale:1,duration:0.15,ease:'power3.in',immediateRender:false},10.9);
tl.fromTo('#m2',{opacity:0},{opacity:1,duration:0.4,immediateRender:false},11.8);
tl.fromTo('#ent',{opacity:1},{opacity:0.55,duration:0.5,yoyo:true,repeat:3,ease:'sine.inOut',immediateRender:false},11.0);
// 4. vista completa
tl.fromTo('#cam',zoom(1360,575,2.1),{...zoom(960,540,1),duration:1.4,ease:'power3.inOut',immediateRender:false},13.0);
tl.fromTo('#black',{opacity:0},{opacity:1,duration:0.5,immediateRender:false},14.45);
const gc=$('#grain').getContext('2d'); const gi=gc.createImageData(960,540);
function grain(t){const fr=Math.floor(t*24); let s=(fr*9301+49297)%233280+1; const dd=gi.data;
 for(let i=0;i<dd.length;i+=4){s=(s*16807)%2147483647; const v=s&255; dd[i]=dd[i+1]=dd[i+2]=v; dd[i+3]=255;} gc.putImageData(gi,0,0);}
const clock={t:0}; tl.fromTo(clock,{t:0},{t:15,duration:15,ease:'none',immediateRender:false,onUpdate:()=>grain(tl.time())},0);
window.__timelines["main"]=tl; tl.seek(0);
</script></body></html>
